services:
  agent-zero:
    container_name: flexia-agent-zero
    image: flexia/agent-zero:latest
    build:
      context: .
      dockerfile: DockerfileLocal
      args:
        BRANCH: local
    volumes:
      - .:/a0
    ports:
      - "8081:80"
    env_file:
      - .env
    environment:
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL:-http://host.docker.internal:8545}
      - VAULT_ADDR=${VAULT_ADDR:-http://host.docker.internal:8200}
    networks:
      - flexia-network
    restart: unless-stopped

networks:
  flexia-network:
    external: true
